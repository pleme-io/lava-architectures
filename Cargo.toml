[package]
authors = ["pleme-io"]
description = "Reusable infrastructure compositions for the lava suite. Hand-authored typed architectures (AwsVpcNetwork, AkeylessAwsIntegration, EksScaleTest, etc.). Pangea-architectures analog — port produces byte-equivalent terraform.json so state files match between pangea+tofu and lava+magma."
edition = "2024"
license = "MIT"
name = "lava-architectures"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-architectures"
version = "0.1.6"

[lib]
name = "lava_architectures"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-core = { git = "https://github.com/pleme-io/lava-core", branch = "main" }
lava-arch = { git = "https://github.com/pleme-io/lava-arch", branch = "main" }
lava-contracts = { git = "https://github.com/pleme-io/lava-contracts", branch = "main" }
lava-eval = { git = "https://github.com/pleme-io/lava-eval", branch = "main" }
lava-schema = { git = "https://github.com/pleme-io/lava-schema", branch = "main" }
lava-types = { git = "https://github.com/pleme-io/lava-types", branch = "main" }
